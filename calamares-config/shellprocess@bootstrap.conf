dontChroot: true
timeout: 600
script:
    - mkdir -p ${ROOT}/media/cdrom
    - mount --bind /media/cdrom ${ROOT}/media/cdrom
    - tar -X /etc/calamares/excludes/overlay.txt -xzf /media/cdrom/matcha.apkovl.tar.gz -C ${ROOT}
    - >
      apk add --root ${ROOT} --initdb --no-cache
      --allow-untrusted
      /media/cdrom/alpine-base*.apk /media/cdrom/linux*.apk
