dontChroot: true
timeout: 600
script:
    - tar -X /etc/calamares/excludes/overlay.txt -xzf /media/cdrom/matcha.apkovl.tar.gz -C $ROOT
    - mkdir -p $ROOT/media/cdrom
    - mkdir -p $ROOT/etc/calamares/excludes
    - mkdir -p $ROOT/etc/calamares/scripts
    - mkdir -p $ROOT/etc/apk/keys
    - mount --bind /etc/calamares/excludes $ROOT/etc/calamares/excludes
    - mount --bind /etc/calamares/scripts $ROOT/etc/calamares/scripts
    - cp /etc/apk/keys/*.rsa.pub $ROOT/etc/apk/keys/
    - cp /etc/apk/matcha-pkgs $ROOT/etc/apk/matcha-pkgs
    - /etc/calamares/scripts/mount-install-iso.sh $ROOT
    - >
      apk add --no-cache
      --root $ROOT --initdb
      --repositories-file /dev/null
      --repository /media/cdrom/apks
      alpine-base
