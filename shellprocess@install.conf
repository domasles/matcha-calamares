dontChroot: false
timeout: 600
script:
    - "apk add --no-cache /media/cdrom/apks/x86_64/*.apk"
    - "tar -xzf /media/cdrom/matcha.apkovl.tar.gz -C /"
    - "mkdir -p /etc/default"
    - "echo 'GRUB_TIMEOUT=3' > /etc/default/grub"
    - "echo 'GRUB_DISTRIBUTOR=\"Matcha Linux\"' >> /etc/default/grub"
    - "echo 'GRUB_DEFAULT=0' >> /etc/default/grub"
    - "echo 'GRUB_DISABLE_LINUX_UUID=false' >> /etc/default/grub"
    - "echo 'GRUB_CMDLINE_LINUX_DEFAULT=\"quiet modules=ext4\"' >> /etc/default/grub"
    - "grub-mkconfig -o /boot/grub/grub.cfg"
