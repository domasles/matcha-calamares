dontChroot: true
timeout: 600
script:
    - mkdir -p ${ROOT}/media/cdrom
    - mount --bind /media/cdrom ${ROOT}/media/cdrom
    - ROOT=${ROOT} /usr/libexec/calamares/extract-overlay.sh
    - >
      apk add --root ${ROOT} --initdb --no-cache
      --repository https://dl-cdn.alpinelinux.org/alpine/v3.23/main
      --allow-untrusted
      alpine-base linux-lts linux-firmware-none grub grub-bios grub-efi
